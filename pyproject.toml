[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairlead"
version = "1.0.0"
description = "fairlead — MCP & LLM gateway assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.1.0",
  "pydantic>=2.11.0",
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "httpx>=0.28.0",
  "pyjwt>=2.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.1.0"]

[project.scripts]
task1 = "mcp_lab.task1.server:main"
task2-downstream = "mcp_lab.task2.downstream:main"
task2 = "mcp_lab.task2.proxy:main"
task3 = "mcp_lab.task3.server:main"
task4 = "mcp_lab.task4.server:main"
mock-llm = "mcp_lab.mocks.llm:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_lab"]

[tool.hatch.build.targets.wheel.sources]
"src/mcp_lab" = "mcp_lab"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
